              type: object
        "401":
          description: Organization ID missing or unauthorized
          schema:
            $ref: '#/definitions/api_handler.ErrorResponse'
        "500":
          description: Failed to fetch employees
          schema:
            $ref: '#/definitions/api_handler.ErrorResponse'
