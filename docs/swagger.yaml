      consumes:
      - application/json
      description: Retrieves paginated list of all employees in the organization with
        support for searching, sorting, and filtering by department, designation,
        or position
      parameters:
      - default: 1
        description: Page number
        example: 1
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        example: 10
        in: query
        name: page_size
        type: integer
      - default: id
        description: Sort field
        enum:
        - id
        - full_name
        - created_at
        in: query
        name: sort_by
        type: string
      - default: asc
        description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      - description: Search by name or email
        example: '"John Doe"'
        in: query
        name: q
        type: string
      - description: Filter by department IDs (comma-separated)
        example: '"1,2,3"'
        in: query
        name: department_id
        type: string
      - description: Filter by designation IDs (comma-separated)
        example: '"1,2"'
        in: query
        name: designation_id
        type: string
      - description: Filter by position IDs (comma-separated)
        example: '"1"'
        in: query
        name: position_id
        type: string
      - description: Filter by contract status
        example: '"ACTIVE"'
        in: query
        name: contract_status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Employees retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/api_handler.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_edsonmubezi_myapp_internal_employee.Employee'
