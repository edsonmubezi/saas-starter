[SERVICE]
    Flush        5
    Daemon       off
    Log_Level    info
    Parsers_File parsers.conf
    # Increase storage buffer limit
    storage.path              /tmp/flb-storage/
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 5M

# Collect from Docker container logs
# Note: Using polling instead of inotify to reduce file handles
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    Refresh_Interval  10
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    # Use polling instead of inotify to prevent "too many open files"
    Inotify_Watcher   false
    # Limit number of files to monitor
    Rotate_Wait       30

# Parse Docker JSON logs
[FILTER]
    Name                parser
    Match               docker.*
    Key_Name            log
    Parser              json
    Reserve_Data        True
    Preserve_Key        False

# Extract container name
[FILTER]
    Name                modify
    Match               docker.*
    Add                 cluster ekklesiahr
    Add                 environment production

# Send to Loki
[OUTPUT]
    Name                loki
    Match               docker.*
    Host                loki
    Port                3100
    Labels              job=ekklesiahr
    Label_keys          $container_name,$environment
    Line_format         json
    Auto_kubernetes_labels off
