# =====================================================================
# SECRET TEMPLATE — DO NOT COMMIT WITH REAL VALUES
# Populate these in your CI/CD pipeline or via sealed-secrets/external-secrets
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: saas-starter-secrets
  namespace: saas-starter
type: Opaque
stringData:
  # PostgreSQL
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"

  # Security — JWT_SECRET must be 64+ bytes, SECRET_KEY must be exactly 32 bytes
  JWT_SECRET: "REPLACE_ME_with_64+_random_bytes"
  SECRET_KEY: "REPLACE_ME_exactly_32_bytes_here"

  # Redis
  REDIS_PASSWORD: "REPLACE_ME"

  # AWS S3
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "REPLACE_ME"
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"

  # SMTP Email
  SMTP_HOST: "smtp.your-provider.com"
  SMTP_PORT: "587"
  SMTP_USER: "REPLACE_ME"
  SMTP_PASSWORD: "REPLACE_ME"
  SMTP_FROM_ADDRESS: "noreply@your-domain.com"
  SMTP_FROM_NAME: "SaaS Platform"

  # OpenAI (optional — per-org key preferred)
  OPENAI_API_KEY: ""
