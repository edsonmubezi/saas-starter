apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-starter-api
  namespace: saas-starter
  labels:
    app: saas-starter-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saas-starter-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: saas-starter-api
    spec:
      # Non-root security context
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: api
          image: your-registry/saas-starter:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: saas-starter-config
            - secretRef:
                name: saas-starter-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          # Liveness: restart if application is stuck
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          # Readiness: only route traffic when DB is reachable
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Startup: allow extra time during cold start (migrations)
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      # Graceful termination — matches server 30s shutdown grace period
      terminationGracePeriodSeconds: 40
