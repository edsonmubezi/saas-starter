apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-starter-config
  namespace: saas-starter
data:
  PORT: "8080"
  HOST: "0.0.0.0"
  ENV: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_SAMPLING: "true"
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "saas_db"
  DB_SSLMODE: "require"
  STORAGE_TYPE: "s3"
  SMTP_ENABLED: "true"
  SESSION_MANAGEMENT_ENABLED: "true"
  SESSION_MAX_CONCURRENT: "5"
  SESSION_TOKEN_EXPIRY_MINUTES: "60"
  SESSION_REFRESH_TOKEN_EXPIRY_DAYS: "30"
  SESSION_ROTATE_REFRESH_TOKENS: "true"
  AUDIT_WORKER_ENABLED: "true"
  AUDIT_WORKER_POLL_INTERVAL: "5s"
  AUDIT_WORKER_BATCH_SIZE: "500"
  ALERTING_ENABLED: "true"
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: "saas-starter"
  CORS_ALLOWED_ORIGIN: "https://your-domain.com"
